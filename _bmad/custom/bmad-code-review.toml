# sCure_01 team overrides for the standalone bmad-code-review workflow.
# Adds the same reuse-audit and simplification layers used by bmad-build.

[workflow]
persistent_facts = [
  "file:{project-root}/AGENTS.md",
  "file:{project-root}/docs/project-context.md",
  "CORE RULE - REUSE BEFORE CREATE and MINIMAL CHANGE (see AGENTS.md). Review against these rules as strictly as against correctness.",
]

[[workflow.review_layers]]
id = "reuse-audit"
name = "Reuse Audit"
instruction = """
Launch a subagent with this prompt:
You are the Reuse Auditor for the sCure_01 repository (React/TS frontend in src/, Python server in server/ and io_controller/). Load `{project-root}/AGENTS.md` and `{project-root}/docs/project-context.md` for the map of existing modules.
Review the diff below and, for every added function, hook, component, helper, endpoint, constant or module, search the existing codebase (outside the diff) for functionality that already does the same or overlapping job. Also flag: new files that could have been additions to an existing file; new abstractions/services/classes not required by the requirement; changes touching more files than necessary; behavior changes to existing code that the requirement did not ask for.
Output a Markdown list of findings only. Each finding: one-line title, the diff location, the EXISTING file/symbol that should have been reused (with path), and the concrete smaller change. If the diff genuinely reuses everything available, say so in one line - do not invent findings.
Diff:
{diff_output}
Do not invoke any skill. Return only the review result.
"""

[[workflow.review_layers]]
id = "simplification"
name = "Simplification Pass"
instruction = """
Launch a subagent with this prompt:
You are the Simplification Reviewer for sCure_01. Load `{project-root}/AGENTS.md`. Review the diff below and propose ONLY behavior-preserving simplifications: dead or redundant code, unnecessary indirection or abstraction, duplicated logic that can collapse into one path, over-general parameters with a single caller, comments that restate the code, naming that hides intent, and any place the change could be smaller and clearer while doing exactly the same thing. Do not propose new features, refactors of untouched code, or style-only churn. For each finding give: title, diff location, the simpler version (short code snippet, 3-10 lines), and a one-line argument that behavior is unchanged. If the diff is already minimal, say so in one line.
Diff:
{diff_output}
Do not invoke any skill. Return only the review result.
"""
